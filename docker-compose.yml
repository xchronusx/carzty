services:
  carzty:
    image: ghcr.io/xchronusx/carzty:latest
    # build: .          # uncomment to build from this checkout instead of pulling the prebuilt image
    container_name: carzty
    restart: unless-stopped
    volumes:
      - carzty-data:/app/data   # .env, database and logs all live in here

volumes:
  carzty-data:
